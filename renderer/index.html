<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: http: data:; media-src 'self' https: http: http://127.0.0.1:* blob: data:; connect-src 'self' https: http: blob:; worker-src 'self' blob:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radyn</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M6.5 5h3.6v14H6.5zM13.9 5h3.6v14h-3.6z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path fill="currentColor" d="M6 6h2.2v12H6zM19 6.6v10.8a.8.8 0 0 1-1.25.66l-8.2-5.4a.8.8 0 0 1 0-1.32l8.2-5.4A.8.8 0 0 1 19 6.6z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path fill="currentColor" d="M15.8 6H18v12h-2.2zM5 6.6v10.8a.8.8 0 0 0 1.25.66l8.2-5.4a.8.8 0 0 0 0-1.32l-8.2-5.4A.8.8 0 0 0 5 6.6z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.9 1-5.9-4.3-4.1 5.9-.8z"/></symbol>
    <symbol id="i-star-fill" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.9 1-5.9-4.3-4.1 5.9-.8z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></g></symbol>
    <symbol id="i-radio" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M7.4 7.4a6.4 6.4 0 0 0 0 9.2M16.6 7.4a6.4 6.4 0 0 1 0 9.2M4.6 4.6a10.6 10.6 0 0 0 0 14.8M19.4 4.6a10.6 10.6 0 0 1 0 14.8"/></g></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.5 3.6 5.3 3.6 8.5s-1.2 6-3.6 8.5c-2.4-2.5-3.6-5.3-3.6-8.5s1.2-6 3.6-8.5z"/></g></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 4.5L3.5 6.5v13L9 17.5l6 2 5.5-2v-13L15 6.5z"/><path d="M9 4.5v13M15 6.5v13"/></g></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18.3 6.5a7.6 7.6 0 0 1 0 11"/></g></symbol>
    <symbol id="i-volume-off" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></g></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="logo-mark.png" alt="" width="34" height="34">
        <span>Radyn</span>
      </div>

      <nav class="nav" aria-label="Ana kategoriler">
        <button class="nav-item active" data-view="home" type="button">
          <svg class="ic" aria-hidden="true"><use href="#i-map"/></svg><span data-i18n="nav_home">Bulunduğum ülke</span>
        </button>
        <button class="nav-item" data-view="top" type="button">
          <svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg><span data-i18n="nav_top">Popüler</span>
        </button>
        <button class="nav-item" data-view="favorites" type="button">
          <svg class="ic" aria-hidden="true"><use href="#i-star"/></svg><span data-i18n="nav_favorites">Favoriler</span>
          <span class="count" id="favCount">0</span>
        </button>
        <button class="nav-item" data-view="recent" type="button">
          <svg class="ic" aria-hidden="true"><use href="#i-clock"/></svg><span data-i18n="nav_recent">Son dinlenenler</span>
        </button>
      </nav>

      <div class="browse-head">
        <span class="label" data-i18n="explore">Keşfet</span>
        <div class="seg" role="group" aria-label="">
          <button class="seg-btn active" data-browse="countries" type="button" data-i18n="tab_countries">Ülkeler</button>
          <button class="seg-btn" data-browse="tags" type="button" data-i18n="tab_genres">Türler</button>
        </div>
      </div>

      <input id="browseFilter" class="field small" type="search" data-i18n-placeholder="filter_placeholder" placeholder="Listede ara…" aria-label="">
      <ul id="browseList" class="browse-list" aria-label=""></ul>

      <div class="lang-row">
        <label class="lang-label">
          <span class="lang-caption" data-i18n="language">Dil</span>
          <select id="langSelect" class="lang-select">
            <option value="tr">Türkçe</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
          </select>
        </label>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="titles">
          <h1 id="viewTitle"></h1>
          <p id="viewSub" class="muted"></p>
        </div>
        <form id="searchForm" class="search" role="search">
          <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="searchInput" class="field" type="search" data-i18n-placeholder="search_placeholder" data-i18n-aria-label="search_label" placeholder="Dünya genelinde istasyon ara (Ctrl+F)" aria-label="İstasyon ara">
        </form>
      </header>

      <section id="stationGrid" class="grid" aria-live="polite"></section>
      <div id="emptyState" class="empty hidden"></div>
    </main>

    <footer class="player">
      <div class="now">
        <div id="art" class="art" aria-hidden="true"></div>
        <div class="meta">
          <div id="npTitle" class="np-title"></div>
          <div id="npSub" class="np-sub"></div>
        </div>
        <button id="favCurrent" class="icon-btn" type="button" disabled></button>
      </div>

      <div class="controls">
        <button id="prevBtn" class="icon-btn" type="button" disabled>
          <svg class="ic" aria-hidden="true"><use href="#i-prev"/></svg>
        </button>
        <button id="playBtn" class="play-btn" type="button">
          <svg class="ic" aria-hidden="true"><use href="#i-play"/></svg>
        </button>
        <button id="nextBtn" class="icon-btn" type="button" disabled>
          <svg class="ic" aria-hidden="true"><use href="#i-next"/></svg>
        </button>
      </div>

      <div class="side">
        <span id="status" class="status" aria-live="polite"></span>
        <div class="volume">
          <button id="muteBtn" class="icon-btn mute-btn" type="button" aria-pressed="false">
            <svg class="ic" aria-hidden="true"><use href="#i-volume"/></svg>
          </button>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" data-i18n-aria-label="volume" aria-label="Ses seviyesi">
        </div>
      </div>
    </footer>
  </div>

  <audio id="audio" preload="none"></audio>

  <script src="../src/strings.js"></script>
  <script src="../src/id3.js"></script>
  <script src="../node_modules/hls.js/dist/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
